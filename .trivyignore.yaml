# Trivy ignore file for alpen-publish-ecr.yml.
# Same structure as alpenlabs/blockscout-fe .trivyignore.yaml.
#
# Vulnerability findings are reported, not blocking, so an entry here only
# removes a finding from the report. Use it for findings that CANNOT
# currently be fixed by a dependency bump. Every entry needs a `statement`
# covering:
#   - dependency path
#   - why no fix is reachable
#   - what an upstream fix needs (links)
#   - risk for this image
# Optional `expired_at: YYYY-MM-DD` forces a re-review.
#
# Changes need a PR reviewed by CODEOWNERS. Read from alpen-main only, so an
# unreviewed build ref cannot hide findings.
vulnerabilities: []
